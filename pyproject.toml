[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "archiv-core"
version = "0.1.0a6"
description = "Local-first, evidence-backed knowledge-work core"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Archiv contributors" }]
dependencies = [
  "mcp>=2,<3",
  "olefile==0.47",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "pydantic>=2.8,<3",
  "pypdf==6.16.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
pdf = [
  "pdfminer-six>=20240706",
  "pdfplumber>=0.11.0",
  "pypdfium2>=5.0.0",
]
dev = [
  "pdfminer-six>=20240706",
  "pdfplumber>=0.11.0",
  "pypdfium2>=5.0.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "reportlab==5.0.1",
  "ruff>=0.9",
  "xlwt==1.3.0",
]
ocr-benchmark = [
  "onnxruntime==1.29.0",
  "python-bidi==0.6.11",
  "rapidocr==3.9.2",
]

[project.scripts]
archiv = "archiv.cli:app"
archiv-mcp = "archiv.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archiv"]

# The compatibility matrix is authored once at docs/format-compatibility.json and
# shipped into the wheel so `archiv formats` reports the same tested claims from
# an installed copy. Force-including avoids a second, driftable copy in the tree.
[tool.hatch.build.targets.wheel.force-include]
"docs/format-compatibility.json" = "archiv/data/format-compatibility.json"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
stubPath = "typings"
extraPaths = ["scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
