[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "archiv-core"
version = "0.1.0a5"
description = "Local-first, evidence-backed knowledge-work core"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Archiv contributors" }]
dependencies = [
  "mcp>=2,<3",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "pydantic>=2.8,<3",
  "pypdf==6.15.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "reportlab==5.0.0",
  "ruff>=0.9",
]
ocr-benchmark = [
  "onnxruntime==1.27.0",
  "python-bidi==0.6.11",
  "rapidocr==3.9.2",
]

[project.scripts]
archiv = "archiv.cli:app"
archiv-mcp = "archiv.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archiv"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
