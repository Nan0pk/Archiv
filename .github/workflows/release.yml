name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r .github/release-requirements.txt
      - run: python -m build
      # The dependency list must describe what the wheel installs.
      # A plain target folder, so neither the release tools nor a venv's own pip are listed.
      - run: python -m pip install --target "$RUNNER_TEMP/installed" dist/*.whl
      - run: python -m pip_audit --path "$RUNNER_TEMP/installed" --format cyclonedx-json --output dist/sbom.cdx.json
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/*"
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9
        with:
          inputs: ./dist/*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          # Every 0.1.0aN tag so far is an alpha; remove this for a stable release.
          prerelease: true
          files: |
            dist/*
