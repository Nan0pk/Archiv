name: Temporary OCR engine comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archiv-temporary-ocr-engine-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public-safe OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap curl fonts-nafees fonts-noto-core time \
            tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng tesseract-ocr-urd
          python -m pip install --upgrade pip
          python -m pip install -e '.[ocr-benchmark]'

      - name: Materialize exact Tesseract model set
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/archiv-ocr-comparison"
          TESSDATA="$RUNNER_TEMP/archiv-tessdata"
          mkdir -p "$EVIDENCE" "$TESSDATA"
          SYSTEM_TESSDATA=$(tesseract --list-langs 2>&1 | sed -n 's/.*in "\([^"]*\)".*/\1/p' | head -n1)
          test -d "$SYSTEM_TESSDATA"
          for language in eng ara urd; do
            test -f "$SYSTEM_TESSDATA/$language.traineddata"
            ln -s "$SYSTEM_TESSDATA/$language.traineddata" "$TESSDATA/$language.traineddata"
          done
          curl --fail --show-error --location --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_contrib/1b7ada6f9ed0e165f06b3212500e1433fdf4dfc7/urd_naw/best/urd_naw.traineddata \
            --output "$TESSDATA/urd_naw.traineddata"
          python - "$TESSDATA/urd_naw.traineddata" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()
          actual_blob = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          expected_blob = "cb79560e7c97ea56082d1e285ffa3dcc319b1113"
          if actual_blob != expected_blob:
              raise SystemExit(f"urd_naw Git blob mismatch: {actual_blob}")
          print(f"urd_naw sha256={hashlib.sha256(data).hexdigest()} bytes={len(data)}")
          PY
          {
            uname -a
            python --version
            tesseract --version
            tesseract --list-langs
            dpkg-query -W -f='${Package}\t${Version}\t${Installed-Size}\n' \
              bubblewrap fonts-nafees fonts-noto-core tesseract-ocr \
              tesseract-ocr-ara tesseract-ocr-eng tesseract-ocr-urd
            python -m pip show rapidocr onnxruntime
          } > "$EVIDENCE/environment.txt" 2>&1
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          echo "TESSDATA_PREFIX=$TESSDATA" >> "$GITHUB_ENV"

      - name: Materialize optional models
        env:
          OMP_THREAD_LIMIT: "2"
        run: |
          archiv benchmark-ocr \
            --output "$EVIDENCE" \
            --engines tesseract,rapidocr,kraken \
            --candidates eng,ara,urd,eng+ara+urd,urd_naw,eng+ara+urd_naw >/dev/null

      - name: Run final comparison with egress denied
        shell: bash
        env:
          OMP_THREAD_LIMIT: "2"
        run: |
          set -euo pipefail
          ARCHIV=$(command -v archiv)
          bwrap \
            --unshare-net \
            --die-with-parent \
            --new-session \
            --ro-bind / / \
            --dev /dev \
            --proc /proc \
            --tmpfs /tmp \
            --bind "$EVIDENCE" "$EVIDENCE" \
            --chdir "$GITHUB_WORKSPACE" \
            --setenv TESSDATA_PREFIX "$TESSDATA_PREFIX" \
            --setenv OMP_THREAD_LIMIT "$OMP_THREAD_LIMIT" \
            --setenv ARCHIV_OCR_BENCHMARK_NETWORK denied-bubblewrap \
            -- "$ARCHIV" benchmark-ocr \
              --output "$EVIDENCE" \
              --engines tesseract,rapidocr,kraken \
              --candidates eng,ara,urd,eng+ara+urd,urd_naw,eng+ara+urd_naw

      - name: Verify public-safe evidence
        run: |
          test -s "$EVIDENCE/report.json"
          test -s "$EVIDENCE/summary.md"
          test -s "$EVIDENCE/shareable-summary.json"
          test -s "$EVIDENCE/corpus.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE"])
          report = json.loads((root / "report.json").read_text())
          assert report["private_fixture_count"] == 0
          assert report["environment"]["network_policy"] == "denied-bubblewrap"
          print((root / "summary.md").read_text())
          PY

      - name: Upload public-safe comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archiv-temporary-ocr-engine-comparison
          path: |
            ${{ env.EVIDENCE }}/report.json
            ${{ env.EVIDENCE }}/summary.md
            ${{ env.EVIDENCE }}/shareable-summary.json
            ${{ env.EVIDENCE }}/corpus.json
            ${{ env.EVIDENCE }}/environment.txt
          if-no-files-found: error
          retention-days: 7
