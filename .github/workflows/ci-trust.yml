name: CI trust boundary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/audit_ci_trust.py"
      - "tests/test_github_governance.py"
      - "docs/github-governance.md"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/audit_ci_trust.py"
      - "tests/test_github_governance.py"
      - "docs/github-governance.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archiv-ci-trust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Archiv and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Audit workflow trust policy
        run: python scripts/audit_ci_trust.py --root . --output ci-trust-report.json

      - name: Run governance regression tests
        run: pytest -q tests/test_github_governance.py

      - name: Upload trust report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: archiv-ci-trust
          path: ci-trust-report.json
          if-no-files-found: error
          retention-days: 7
