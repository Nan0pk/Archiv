name: MCP validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/archiv/mcp_*.py"
      - "tests/mcp_support.py"
      - "tests/test_mcp_*.py"
      - "scripts/build_mcp_validation_artifacts.py"
      - "pyproject.toml"
      - ".github/workflows/mcp-validation.yml"

permissions:
  contents: read

concurrency:
  group: archiv-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-stdio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Archiv and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Test in-memory and real stdio MCP transports
        run: |
          mkdir -p mcp-artifacts
          pytest -q tests/test_mcp_tools.py tests/test_mcp_protocol.py \
            --junitxml=mcp-artifacts/pytest.xml

      - name: Build synthetic MCP run evidence
        run: python scripts/build_mcp_validation_artifacts.py --output-dir mcp-artifacts

      - name: Upload MCP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: archiv-mcp-validation
          path: |
            mcp-artifacts/pytest.xml
            mcp-artifacts/summary.json
            mcp-artifacts/archiv-home/runs/mcp/**/*.json
            mcp-artifacts/archiv-home/outputs/mcp/*.docx
            mcp-artifacts/archiv-home/outputs/mcp/*.json
          if-no-files-found: error
          retention-days: 14
