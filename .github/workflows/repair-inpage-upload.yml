name: Repair InPage research upload

on:
  push:
    branches: [research/native-inpage-capability]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/native-inpage-capability

      - name: Apply exact transport corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/archiv/research/inpage_cfb_probe.py')
          content = path.read_text()
          replacements = {
              'number_of_fat_sector3': 'number_of_fat_sectors',
              'FRESECT': 'FREESECT',
          }
          for wrong, correct in replacements.items():
              count = content.count(wrong)
              if count != 1:
                  raise SystemExit(f'expected one {wrong!r}, found {count}')
              content = content.replace(wrong, correct)
          path.write_text(content)
          PY
          rm .github/workflows/repair-inpage-upload.yml

      - name: Commit corrected branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/archiv/research/inpage_cfb_probe.py .github/workflows/repair-inpage-upload.yml
          git commit -m 'Correct InPage probe upload transcription'
          git push origin HEAD:research/native-inpage-capability
