name: Office validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/office-validation.yml"

permissions:
  contents: read

concurrency:
  group: archiv-office-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install document renderers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-liberation \
            libreoffice-writer \
            poppler-utils

      - name: Install Archiv
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Build and independently validate report artifacts
        run: python scripts/build_office_validation_artifacts.py --output-dir office-artifacts

      - name: Upload report evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archiv-office-validation
          path: |
            office-artifacts/*.docx
            office-artifacts/*.json
            office-artifacts/*.pdf
            office-artifacts/page-*.png
          if-no-files-found: error
          retention-days: 14
