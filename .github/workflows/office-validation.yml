name: Office validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/office-validation.yml"

permissions:
  contents: read

concurrency:
  group: archiv-office-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install document renderers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-liberation \
            libreoffice-writer \
            poppler-utils

      - name: Install Archiv
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Build and independently validate report artifacts
        run: python scripts/build_office_validation_artifacts.py --output-dir office-artifacts

      - name: Upload report evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archiv-office-validation
          path: |
            office-artifacts/*.docx
            office-artifacts/*.json
            office-artifacts/*.pdf
            office-artifacts/page-*.png
          if-no-files-found: error
          retention-days: 14
