name: Temporary UI validation

on:
  push:
    branches:
      - feature/archiv-test-console

permissions:
  contents: read

concurrency:
  group: archiv-temporary-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install desktop smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk xdg-utils

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

      - name: Test
        run: pytest -q

      - name: Smoke-test CLI
        run: archiv doctor --json

      - name: Smoke-test command catalog
        run: |
          python - <<'PY'
          from archiv.cli import app
          from archiv.ui_console import build_command_catalog

          names = {command.display_name for command in build_command_catalog(app)}
          assert {"ingest", "source", "model configure"}.issubset(names)
          assert "ui" not in names
          print(f"Cataloged {len(names)} public commands")
          PY

      - name: Smoke-test native window under Xvfb
        run: |
          xvfb-run -a python - <<'PY'
          from archiv.cli import app
          from archiv.ui_console import ArchivTestConsole

          console = ArchivTestConsole(app)
          console._root.update_idletasks()
          console._close()
          print("Archiv Test Console opened and closed successfully")
          PY
