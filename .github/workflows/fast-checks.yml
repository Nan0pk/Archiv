name: Fast checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: archiv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

      - name: Test
        run: pytest -q

      - name: Smoke-test CLI
        run: archiv doctor --json

  temporary-ocr-engine-reference:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/ocr-engine-comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build isolated OCR benchmark image
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Dockerfile.ocr" <<'DOCKERFILE'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive PIP_BREAK_SYSTEM_PACKAGES=1
          RUN apt-get update \
            && apt-get install -y --no-install-recommends \
              curl fonts-nafees fonts-noto-core python3 python3-pip time \
              tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng tesseract-ocr-urd \
            && rm -rf /var/lib/apt/lists/*
          WORKDIR /workspace
          COPY . /workspace
          RUN python3 -m pip install --break-system-packages -e '.[ocr-benchmark]'
          ENTRYPOINT ["archiv"]
          DOCKERFILE
          docker build --pull \
            --file "$RUNNER_TEMP/Dockerfile.ocr" \
            --tag archiv-ocr-benchmark:ci \
            .

      - name: Materialize exact Tesseract model set
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/archiv-ocr-comparison"
          TESSDATA="$RUNNER_TEMP/archiv-tessdata"
          mkdir -p "$EVIDENCE" "$TESSDATA"
          docker run --rm \
            --entrypoint sh \
            --volume "$TESSDATA:/out" \
            archiv-ocr-benchmark:ci \
            -c '
              set -eu
              SYSTEM_TESSDATA=$(tesseract --list-langs 2>&1 | sed -n '\''s/.*in "\([^"]*\)".*/\1/p'\'' | head -n1)
              test -d "$SYSTEM_TESSDATA"
              cp "$SYSTEM_TESSDATA/eng.traineddata" /out/
              cp "$SYSTEM_TESSDATA/ara.traineddata" /out/
              cp "$SYSTEM_TESSDATA/urd.traineddata" /out/
            '
          docker run --rm \
            --network bridge \
            --entrypoint sh \
            --volume "$TESSDATA:/out" \
            archiv-ocr-benchmark:ci \
            -c '
              set -eu
              curl --fail --show-error --location --retry 3 \
                https://raw.githubusercontent.com/tesseract-ocr/tessdata_contrib/1b7ada6f9ed0e165f06b3212500e1433fdf4dfc7/urd_naw/best/urd_naw.traineddata \
                --output /out/urd_naw.traineddata
              python3 - /out/urd_naw.traineddata <<'\''PY'\''
          import hashlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()
          actual_blob = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          expected_blob = "cb79560e7c97ea56082d1e285ffa3dcc319b1113"
          if actual_blob != expected_blob:
              raise SystemExit(f"urd_naw Git blob mismatch: {actual_blob}")
          print(f"urd_naw sha256={hashlib.sha256(data).hexdigest()} bytes={len(data)}")
          PY
            '
          {
            echo "docker_image=archiv-ocr-benchmark:ci"
            docker image inspect archiv-ocr-benchmark:ci --format 'image_bytes={{.Size}} image_id={{.Id}}'
            docker run --rm --entrypoint sh archiv-ocr-benchmark:ci -c '
              uname -a
              python3 --version
              tesseract --version
              tesseract --list-langs
              dpkg-query -W -f="${Package}\t${Version}\t${Installed-Size}\n" \
                fonts-nafees fonts-noto-core tesseract-ocr \
                tesseract-ocr-ara tesseract-ocr-eng tesseract-ocr-urd
              python3 -m pip show rapidocr onnxruntime
            '
          } > "$EVIDENCE/environment.txt" 2>&1
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          echo "TESSDATA=$TESSDATA" >> "$GITHUB_ENV"

      - name: Materialize optional models
        env:
          OMP_THREAD_LIMIT: "2"
        run: |
          docker run --rm \
            --network bridge \
            --volume "$EVIDENCE:/evidence" \
            --volume "$TESSDATA:/tessdata:ro" \
            --env TESSDATA_PREFIX=/tessdata \
            --env OMP_THREAD_LIMIT="$OMP_THREAD_LIMIT" \
            archiv-ocr-benchmark:ci \
            benchmark-ocr \
              --output /evidence \
              --engines tesseract,rapidocr,kraken \
              --candidates eng,ara,urd,eng+ara+urd,urd_naw,eng+ara+urd_naw >/dev/null

      - name: Run final comparison with egress denied
        shell: bash
        env:
          OMP_THREAD_LIMIT: "2"
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --volume "$EVIDENCE:/evidence" \
            --volume "$TESSDATA:/tessdata:ro" \
            --env TESSDATA_PREFIX=/tessdata \
            --env OMP_THREAD_LIMIT="$OMP_THREAD_LIMIT" \
            --env ARCHIV_OCR_BENCHMARK_NETWORK=denied-docker-network-none \
            archiv-ocr-benchmark:ci \
            benchmark-ocr \
              --output /evidence \
              --engines tesseract,rapidocr,kraken \
              --candidates eng,ara,urd,eng+ara+urd,urd_naw,eng+ara+urd_naw

      - name: Verify public-safe evidence
        run: |
          test -s "$EVIDENCE/report.json"
          test -s "$EVIDENCE/summary.md"
          test -s "$EVIDENCE/shareable-summary.json"
          test -s "$EVIDENCE/corpus.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE"])
          report = json.loads((root / "report.json").read_text())
          assert report["private_fixture_count"] == 0
          assert report["environment"]["network_policy"] == "denied-docker-network-none"
          print((root / "summary.md").read_text())
          PY

      - name: Upload public-safe comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archiv-temporary-ocr-engine-comparison
          path: |
            ${{ env.EVIDENCE }}/report.json
            ${{ env.EVIDENCE }}/summary.md
            ${{ env.EVIDENCE }}/shareable-summary.json
            ${{ env.EVIDENCE }}/corpus.json
            ${{ env.EVIDENCE }}/environment.txt
            ${{ env.EVIDENCE }}/rapidocr-adapter.log
          if-no-files-found: error
          retention-days: 7
