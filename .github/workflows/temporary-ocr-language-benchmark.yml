name: Temporary OCR language benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-ocr-language-benchmark.yml"
      - "src/archiv/ocr_benchmark.py"
      - "src/archiv/ocr_benchmark_cli.py"
      - "tests/test_ocr_benchmark.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archiv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            fonts-noto-extra \
            tesseract-ocr \
            tesseract-ocr-ara \
            tesseract-ocr-eng \
            tesseract-ocr-urd \
            time
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Measure installed language candidates
        run: |
          archiv benchmark-ocr \
            --output "$RUNNER_TEMP/archiv-ocr-benchmark" \
            --candidates eng,ara,urd,eng+ara+urd

      - name: Print sanitized fixture metrics
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "archiv-ocr-benchmark" / "report.json").read_text()
          )
          rows = []
          for run in report["runs"]:
              metrics = run["metrics"]
              rows.append(
                  {
                      "candidate": run["candidate"],
                      "fixture_id": run["fixture_id"],
                      "cer": metrics["cer"],
                      "wer": metrics["wer"],
                      "punctuation_error_rate": metrics["punctuation_error_rate"],
                      "numeral_error_rate": metrics["numeral_error_rate"],
                      "omitted_line": metrics["omitted_line"],
                      "hallucinated_characters": metrics["hallucinated_characters"],
                      "elapsed_seconds": run["elapsed_seconds"],
                      "peak_rss_kib": run["peak_rss_kib"],
                  }
              )
          print(json.dumps({"fixture_metrics": rows}, indent=2, sort_keys=True))
          PY
