# Temporary same-repository bootstrap; self-deletes after applying the overlay.
name: Source snapshot bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: archiv-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'Nan0pk'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted alpha branch without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: release/offline-alpha

      - name: Apply verified development overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf .alpha-overlay.tar.gz
          rm -f .alpha-overlay.tar.gz
          rm -f .github/workflows/source-snapshot-bootstrap.yml
          rm -f .github/workflows/apply-alpha-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: deliver first offline alpha foundation"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:release/offline-alpha
