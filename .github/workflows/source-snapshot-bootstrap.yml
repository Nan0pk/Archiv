# Temporary same-repository bootstrap; removed by the connector after source application.
name: Source snapshot bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: archiv-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'Nan0pk'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted alpha branch without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: release/offline-alpha

      - name: Verify and apply source-only development overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/alpha-chunks.sha256 <<'EOF'
          f04cad33aec285b91b1e23abef5fe505414dfa51ee5b01050fe5b3e53f7c4151  .alpha-overlay.part-00
          3a0caa6b16095081a99b13f8302898adb97acc8eed03ccebc886e7aef8bee765  .alpha-overlay.part-01
          930f5ef760c3f0cd7f49589dfa4d6fb950b0fc1d9c6d3a8963d7ffa82c9edba0  .alpha-overlay.part-02
          e020676876d26209e977466afe432aa859fa635cdc6520d007c0d05d49d6f7ab  .alpha-overlay.part-03
          c34de660641d932253bf424e4c181be48b2dff7d848c75d1a381d53e19ca469e  .alpha-overlay.part-04
          e6ec606f3c0c4eb3bea9531356f4096810fb2420fc24a3508a05be2841bc4733  .alpha-overlay.part-05
          EOF
          sha256sum --check /tmp/alpha-chunks.sha256
          cat .alpha-overlay.part-00 .alpha-overlay.part-01 \
            .alpha-overlay.part-02 .alpha-overlay.part-03 \
            .alpha-overlay.part-04 .alpha-overlay.part-05 \
            > /tmp/archiv-alpha-overlay.tar.gz
          echo "a56e6d29d84fba96944ec8f1ce11428df722cc1a6a692b516d3ff693704b3955  /tmp/archiv-alpha-overlay.tar.gz" \
            | sha256sum --check -
          tar -xzf /tmp/archiv-alpha-overlay.tar.gz
          git checkout -- \
            .github/workflows/cowork-upstream-regression.yml \
            .github/workflows/source-snapshot-bootstrap.yml \
            .github/workflows/apply-alpha-overlay.yml
          rm -f .github/workflows/offline-alpha.yml
          rm -f .alpha-overlay.tar.gz .alpha-overlay.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: deliver first offline alpha foundation"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:release/offline-alpha
