name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: archiv-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6a90bf1f5426d0c367cad0b2000f3b721bab3122
        with:
          languages: python

      - name: Analyze Python
        uses: github/codeql-action/analyze@be7a3dbb8147b82cd6d27e0707105b36aa190fc1
        with:
          category: "/language:python"
