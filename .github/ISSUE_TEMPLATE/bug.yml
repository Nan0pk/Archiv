name: Defect report
description: Report reproducible incorrect behaviour without private data.
title: "Defect: "
body:
  - type: markdown
    attributes:
      value: Never attach private documents, credentials, model keys, production databases, or sensitive logs.
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide commands and generated or redistributable fixtures only.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validator or evidence failure
      description: Identify the failed check, artifact, source hash, or status mismatch.
    validations:
      required: true
